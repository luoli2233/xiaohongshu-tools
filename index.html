<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
 <meta name="theme-color" content="#292d48"><meta name="description" content="在工作和快乐之间找个平衡。十个工作日的横屏像素办公室小游戏。">
 <title>今天摸鱼了吗？｜职场摸鱼小游戏</title>
 <link rel="stylesheet" href="src/style.css">
</head>
<body>
 <main id="game" class="game-shell">
  <header class="topbar"><div><span class="eyebrow">OFFICE ESCAPE CLUB</span><h1>今天摸鱼了吗<span class="question">?</span></h1></div><button id="pause" class="small-button" aria-label="暂停游戏">Ⅱ</button></header>
  <section class="daybar"><span id="day-label">打工人的快乐生存指南</span><span id="timer">10 DAYS</span></section>
  <section id="stats" class="stats" aria-label="角色属性">
   <div class="stat energy"><span>精力</span><strong id="energy">80.0</strong><div class="meter"><i id="energy-bar"></i></div></div>
   <div class="stat skill"><span>技能 <small id="xp-label">0 / 40</small></span><strong id="skill">Lv.1</strong><div class="meter"><i id="skill-bar"></i></div></div>
   <div class="stat favor"><span>老板好感</span><strong id="favor">50</strong><div class="meter"><i id="favor-bar"></i></div></div>
   <div class="stat joy"><span>快乐</span><strong id="joy">0.0</strong><div class="meter"><i id="joy-bar"></i></div></div>
  </section>
  <section class="office" aria-label="像素办公室场景">
   <img id="scene-art" src="assets/home.jpg" alt="暖色像素办公室中的打工人座位">
   <canvas id="scene" width="240" height="224" aria-hidden="true"></canvas>
   <div id="risk" class="risk safe"><span class="status-light"></span><span id="risk-text">风平浪静 · 给自己留一点快乐</span></div>
   <div id="speech" class="speech">上班，是为了更好地下班。</div>
   <span class="room-label">工位 008 / 周一也要快乐</span>
  </section>
  <section class="task-panel"><div><span id="task-name">今日任务 / 日常工作</span><b id="task-value">0.0 / 24</b></div><div class="meter"><i id="task-bar"></i></div><div class="task-bottom"><span id="action-label">准备好开始今天了吗？</span><button id="goal" class="text-button">评估目标 ↗</button></div></section>
  <section class="controls" aria-label="游戏动作">
   <div class="idle-select"><span>摸鱼方式</span><button data-mode="IDLE_THINK" aria-pressed="true">发呆 <small>收手 0.2s</small></button><button data-mode="IDLE_PHONE" aria-pressed="false">手机 <small>收手 1.2s</small></button></div>
   <div class="action-row"><button data-action="WORK" class="action work"><span class="pixel-icon">▤</span><strong>努力工作</strong><small>成长 + 交付</small></button><button id="idle-action" class="action idle"><span class="pixel-icon fish">&gt;&lt;((°&gt;</span><strong>摸一会儿</strong><small>恢复精力 + 快乐</small></button><button data-action="PRETEND" class="action pretend"><span class="pixel-icon">▱▱</span><strong>假装很忙</strong><small>少耗精力 · 有风险</small></button></div>
  </section>
  <footer><span>认真生活，适度摸鱼。</span><button id="sound" class="text-button" aria-pressed="true">音效：开</button></footer>
  <div id="live" class="sr-only" aria-live="polite"></div>
 </main>
 <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
 <script type="module" src="src/app.js"></script>
</body></html>
